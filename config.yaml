app:
  name: WeReadBot
  startup_mode: scheduled
  startup_delay: 60-300
  max_concurrent_users: 1
curl_config:
  file_path: curl_command.txt
reading:
  mode: smart_random
  target_duration: 45-90
  reading_interval: 30-48
  use_curl_data_first: true
  fallback_to_config: true
  smart_random:
    book_continuity: 0.8
    chapter_continuity: 0.7
    book_switch_cooldown: 300
  books:
    - name: 明朝那些事
      book_id: a57325c05c8ed3a57224187
      chapters:
        - chapter_id: a87322c014a87ff679a21ea
        - chapter_id: '4'
human_simulation:
  enabled: true
  reading_speed_variation: true
  break_probability: 0.1
  break_duration: 5-20
  rotate_user_agent: false
network:
  timeout: 30
  retry_times: 3
  retry_delay: 5-15
  rate_limit: 10
notification:
  enabled: true
  include_statistics: true
  only_on_failure: true
  triggers:
    session_success: false
    multi_user_summary: false
    session_failure: true
    runtime_error: true
    general: true
  channels:
    - name: pushplus
      enabled: true
      config:
        token: 1c31b2e2439f4b38843eb2ef5ef1f63b
hack:
  cookie_refresh_ql: false
logging:
  level: INFO
  format: detailed
  file: logs/weread.log
  max_size: 10MB
  backup_count: 5
  console: true
history:
  enabled: true
  file: logs/run-history.json
  max_entries: 50
  persist_runtime_error: true
